<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activity Monitor Lab</title>
<style>body{font:16px system-ui;max-width:850px;margin:25px auto;padding:15px}input,button{padding:10px;margin:5px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:12px}</style>
<h1>Activity Monitor Lab</h1><p>Authorized device reports only. Enter your viewer token; it stays in this browser tab.</p>
<input id="token" type="password" placeholder="Viewer token"><button id="refresh">Refresh</button><pre id="result">No report loaded</pre>
<script>
document.querySelector('#refresh').onclick=async()=>{
 const result=document.querySelector('#result');
 try{
  const r=await fetch('/api/reports',{headers:{'X-Viewer-Token':document.querySelector('#token').value},cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const data=await r.json();
  const parsed=Object.fromEntries(Object.entries(data).map(([k,v])=>[k,JSON.parse(v)]));
  result.textContent=JSON.stringify(parsed,null,2);
 }catch(e){result.textContent='Unable to load: '+e.message;}
};
</script></html>
